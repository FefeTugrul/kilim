name: Release

# v1.0.0 gibi bir tag push edildiğinde npm'e yayınlar.
# Gereken tek ayar: repo Settings > Secrets > Actions > NPM_TOKEN
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance için gerekli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci

      # Tag ile package.json sürümü ayrışırsa yanlış sürüm yayınlanır ve
      # yayınlanmış bir sürüm geri alınamaz.
      - name: Tag ile sürüm eşleşiyor mu
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG ile package.json sürümü $PKG eşleşmiyor."
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size

      # Paket yüzeyi denetimi: exports haritası, tip çözümlemesi, tarball içeriği.
      - run: npx publint --strict
      - run: npx --yes @arethetypeswrong/cli --pack .

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
